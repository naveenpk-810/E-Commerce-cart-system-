<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple E-Commerce Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
    }

    header {
      background: #333;
      color: white;
      text-align: center;
      padding: 1rem 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: 2rem auto;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.5rem;
    }

    .product {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .product img {
      max-width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    .product h3 {
      margin: 0.5rem 0;
    }

    .product p {
      font-weight: bold;
      color: #333;
    }

    .product button {
      background: #007bff;
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .product button:hover {
      background: #0056b3;
    }

    .cart {
      background: white;
      margin-top: 2rem;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .cart h2 {
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f8f8f8;
    }

    .cart-total {
      text-align: right;
      font-size: 1.2rem;
      margin-top: 1rem;
    }

    .empty {
      text-align: center;
      color: #777;
    }

  </style>
</head>
<body>

  <header>
    <h1>My Online Store</h1>
  </header>

  <div class="container">
    <div class="products" id="product-list">
      <!-- Products will appear here -->
    </div>

    <div class="cart" id="cart">
      <h2>Your Cart</h2>
      <div id="cart-items"></div>
      <div class="cart-total" id="cart-total">Total: $0.00</div>
    </div>
  </div>

  <script>
    const products = [
      { id: 1, name: "Wireless Headphones", price: 49.99, image: "https://via.placeholder.com/200?text=Headphones" },
      { id: 2, name: "Smart Watch", price: 89.99, image: "https://via.placeholder.com/200?text=Smart+Watch" },
      { id: 3, name: "Bluetooth Speaker", price: 39.99, image: "https://via.placeholder.com/200?text=Speaker" },
      { id: 4, name: "Gaming Mouse", price: 29.99, image: "https://via.placeholder.com/200?text=Mouse" },
    ];

    const cart = {};

    const productList = document.getElementById('product-list');
    const cartItemsDiv = document.getElementById('cart-items');
    const cartTotal = document.getElementById('cart-total');

    // Render products
    function renderProducts() {
      products.forEach(p => {
        const div = document.createElement('div');
        div.className = 'product';
        div.innerHTML = `
          <img src="${p.image}" alt="${p.name}">
          <h3>${p.name}</h3>
          <p>$${p.price.toFixed(2)}</p>
          <button onclick="addToCart(${p.id})">Add to Cart</button>
        `;
        productList.appendChild(div);
      });
    }

    // Add to cart
    function addToCart(id) {
      const product = products.find(p => p.id === id);
      if (cart[id]) {
        cart[id].quantity++;
      } else {
        cart[id] = { ...product, quantity: 1 };
      }
      renderCart();
    }

    // Remove from cart
    function removeFromCart(id) {
      delete cart[id];
      renderCart();
    }

    // Update cart display
    function renderCart() {
      cartItemsDiv.innerHTML = '';
      const keys = Object.keys(cart);
      if (keys.length === 0) {
        cartItemsDiv.innerHTML = '<p class="empty">Your cart is empty.</p>';
        cartTotal.textContent = 'Total: $0.00';
        return;
      }

      const table = document.createElement('table');
      table.innerHTML = `
        <tr>
          <th>Product</th>
          <th>Price</th>
          <th>Qty</th>
          <th>Subtotal</th>
          <th></th>
        </tr>
      `;

      let total = 0;
      keys.forEach(key => {
        const item = cart[key];
        const subtotal = item.price * item.quantity;
        total += subtotal;

        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${item.name}</td>
          <td>$${item.price.toFixed(2)}</td>
          <td>
            <input type="number" min="1" value="${item.quantity}" style="width:50px"
              onchange="updateQuantity(${item.id}, this.value)">
          </td>
          <td>$${subtotal.toFixed(2)}</td>
          <td><button onclick="removeFromCart(${item.id})">Remove</button></td>
        `;
        table.appendChild(row);
      });

      cartItemsDiv.appendChild(table);
      cartTotal.textContent = 'Total: $' + total.toFixed(2);
    }

    function updateQuantity(id, quantity) {
      if (quantity <= 0) {
        removeFromCart(id);
      } else {
        cart[id].quantity = parseInt(quantity);
      }
      renderCart();
    }

    renderProducts();
    renderCart();
  </script>

</body>
</html>
